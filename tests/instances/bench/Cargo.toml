[package]
name = "bench"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
rig = { path = "../../rig", features = ["for_tests"] }
zksync_os_tests_common = { path = "../../common" }

[features]
# Gates the synthetic native-transfer single-block benchmark
# (`native_transfers_single_block`). Pulls in `rig/no_print` so the bootloader's
# `system_log!` traces don't dominate stdout during timed runs.
forward-flamegraph = ["rig/no_print"]
